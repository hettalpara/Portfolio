<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Workflow Flowchart Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border-color: #E2E8F0;
      --btn-bg: #FFFFFF;
      --btn-hover: #F1F5F9;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    body.dark-mode {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-color: #334155;
      --btn-bg: #1E293B;
      --btn-hover: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    body.dark-mode header { background-color: rgba(15, 23, 42, 0.8); }
    .brand { display: flex; flex-direction: column; }
    .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .brand p { font-size: 12px; color: var(--text-sub); }
    .controls { display: flex; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--btn-bg);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .btn:hover { background-color: var(--btn-hover); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background-color: #2563EB; color: #FFFFFF; border-color: #2563EB; }
    .btn-primary:hover { background-color: #1D4ED8; border-color: #1D4ED8; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
    .slide-container {
      width: 100%;
      max-width: 540px;
      aspect-ratio: 800 / 1200;
      background-color: #FFFFFF;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      transition: box-shadow 0.3s, transform 0.3s;
    }
    .slide-container:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .slide-container svg { width: 100%; height: 100%; display: block; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: #0F172A;
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Project Workflow Flowchart</h1>
      <p>Clean, Minimal, Portrait Presentation Slide</p>
    </div>
    <div class="controls">
      <button class="btn" id="themeToggleBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        Toggle Dark Interface
      </button>
      <button class="btn" id="copyBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        Copy SVG Code
      </button>
      <button class="btn btn-primary" id="downloadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Download SVG
      </button>
    </div>
  </header>

  <main>
    <div class="slide-container" id="slideContainer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <style>
      .title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #111827;
        letter-spacing: -0.02em;
      }
      .subtitle {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #6B7280;
      }
      .stage-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 500;
      }
      .phase-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .connector-line {
        stroke: #D1D5DB;
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      .connector-arrow {
        fill: none;
        stroke: #9CA3AF;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bracket-line {
        stroke-width: 1.5;
        stroke-linecap: round;
        fill: none;
      }
      .slide-border {
        fill: none;
        stroke: #F3F4F6;
        stroke-width: 1;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="24" y="24" width="752" height="1152" rx="16" class="slide-border"/>

  <text x="460" y="85" text-anchor="middle" class="title">Project Workflow</text>
  <text x="460" y="118" text-anchor="middle" class="subtitle">Nine sequential stages of the project lifecycle</text>

  <!-- ==================== BRACKETS & PHASE LABELS ==================== -->
  
  <!-- Planning Phase Bracket -->
  <path d="M 235 195 L 240 195 L 240 323 L 235 323" class="bracket-line" stroke="#B2DFDB"/>
  <text x="225" y="259" text-anchor="end" dominant-baseline="middle" class="phase-text" fill="#00796B">Planning</text>
  <!-- Design Phase Bracket -->
  <path d="M 235 403 L 240 403 L 240 531 L 235 531" class="bracket-line" stroke="#C5CAE9"/>
  <text x="225" y="467" text-anchor="end" dominant-baseline="middle" class="phase-text" fill="#3F51B5">Design</text>
  <!-- Development Phase Bracket -->
  <path d="M 235 611 L 240 611 L 240 843 L 235 843" class="bracket-line" stroke="#FFE082"/>
  <text x="225" y="727" text-anchor="end" dominant-baseline="middle" class="phase-text" fill="#D84315">Development</text>
  <!-- QA Phase Bracket -->
  <path d="M 235 923 L 240 923 L 240 947 L 235 947" class="bracket-line" stroke="#C8E6C9"/>
  <text x="225" y="935" text-anchor="end" dominant-baseline="middle" class="phase-text" fill="#2E7D32">QA</text>
  <!-- Release Phase Bracket -->
  <path d="M 235 1027 L 240 1027 L 240 1051 L 235 1051" class="bracket-line" stroke="#FECDD3"/>
  <text x="225" y="1039" text-anchor="end" dominant-baseline="middle" class="phase-text" fill="#E11D48">Release</text>

  <!-- ==================== FLOWCHART STAGES (BOXES & TEXT) ==================== -->
  
  <!-- Node 1: Requirement analysis -->
  <rect x="290" y="180" width="340" height="54" rx="8" fill="#E0F2F1" stroke="#B2DFDB" stroke-width="1.2"/>
  <text x="460" y="211.5" text-anchor="middle" class="stage-text" fill="#004D40">Requirement analysis</text>
  <!-- Node 2: Market research -->
  <rect x="290" y="284" width="340" height="54" rx="8" fill="#E0F2F1" stroke="#B2DFDB" stroke-width="1.2"/>
  <text x="460" y="315.5" text-anchor="middle" class="stage-text" fill="#004D40">Market research</text>
  <!-- Node 3: System design -->
  <rect x="290" y="388" width="340" height="54" rx="8" fill="#E8EAF6" stroke="#C5CAE9" stroke-width="1.2"/>
  <text x="460" y="419.5" text-anchor="middle" class="stage-text" fill="#1A237E">System design</text>
  <!-- Node 4: UI/UX design -->
  <rect x="290" y="492" width="340" height="54" rx="8" fill="#E8EAF6" stroke="#C5CAE9" stroke-width="1.2"/>
  <text x="460" y="523.5" text-anchor="middle" class="stage-text" fill="#1A237E">UI/UX design</text>
  <!-- Node 5: Frontend development -->
  <rect x="290" y="596" width="340" height="54" rx="8" fill="#FFF8E1" stroke="#FFE082" stroke-width="1.2"/>
  <text x="460" y="627.5" text-anchor="middle" class="stage-text" fill="#5D4037">Frontend development</text>
  <!-- Node 6: Backend development -->
  <rect x="290" y="700" width="340" height="54" rx="8" fill="#FFF8E1" stroke="#FFE082" stroke-width="1.2"/>
  <text x="460" y="731.5" text-anchor="middle" class="stage-text" fill="#5D4037">Backend development</text>
  <!-- Node 7: API integration -->
  <rect x="290" y="804" width="340" height="54" rx="8" fill="#FFF8E1" stroke="#FFE082" stroke-width="1.2"/>
  <text x="460" y="835.5" text-anchor="middle" class="stage-text" fill="#5D4037">API integration</text>
  <!-- Node 8: Testing -->
  <rect x="290" y="908" width="340" height="54" rx="8" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1.2"/>
  <text x="460" y="939.5" text-anchor="middle" class="stage-text" fill="#1B5E20">Testing</text>
  <!-- Node 9: Deployment -->
  <rect x="290" y="1012" width="340" height="54" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.2"/>
  <text x="460" y="1043.5" text-anchor="middle" class="stage-text" fill="#881337">Deployment</text>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  
  <!-- Connector 1 -> 2 -->
  <line x1="460" y1="234" x2="460" y2="283" class="connector-line"/>
  <path d="M 456 279 L 460 283 L 464 279" class="connector-arrow"/>
  <!-- Connector 2 -> 3 -->
  <line x1="460" y1="338" x2="460" y2="387" class="connector-line"/>
  <path d="M 456 383 L 460 387 L 464 383" class="connector-arrow"/>
  <!-- Connector 3 -> 4 -->
  <line x1="460" y1="442" x2="460" y2="491" class="connector-line"/>
  <path d="M 456 487 L 460 491 L 464 487" class="connector-arrow"/>
  <!-- Connector 4 -> 5 -->
  <line x1="460" y1="546" x2="460" y2="595" class="connector-line"/>
  <path d="M 456 591 L 460 595 L 464 591" class="connector-arrow"/>
  <!-- Connector 5 -> 6 -->
  <line x1="460" y1="650" x2="460" y2="699" class="connector-line"/>
  <path d="M 456 695 L 460 699 L 464 695" class="connector-arrow"/>
  <!-- Connector 6 -> 7 -->
  <line x1="460" y1="754" x2="460" y2="803" class="connector-line"/>
  <path d="M 456 799 L 460 803 L 464 799" class="connector-arrow"/>
  <!-- Connector 7 -> 8 -->
  <line x1="460" y1="858" x2="460" y2="907" class="connector-line"/>
  <path d="M 456 903 L 460 907 L 464 903" class="connector-arrow"/>
  <!-- Connector 8 -> 9 -->
  <line x1="460" y1="962" x2="460" y2="1011" class="connector-line"/>
  <path d="M 456 1007 L 460 1011 L 464 1007" class="connector-arrow"/>
</svg>
    </div>
  </main>

  <div class="toast" id="toast">SVG code copied to clipboard!</div>

  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const toast = document.getElementById('toast');
    const slideContainer = document.getElementById('slideContainer');

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });

    copyBtn.addEventListener('click', () => {
      const svgContent = slideContainer.innerHTML.trim();
      navigator.clipboard.writeText(svgContent).then(() => {
        showToast('SVG XML copied to clipboard!');
      }).catch(err => {
        console.error('Could not copy text: ', err);
      });
    });

    downloadBtn.addEventListener('click', () => {
      const svgContent = slideContainer.innerHTML.trim();
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'project_workflow.svg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('SVG download started!');
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
</body>
</html>
