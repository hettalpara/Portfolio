<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Process Flowchart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #F8FAFC; --text-main: #0F172A; --text-sub: #64748B;
      --border-color: #E2E8F0; --btn-bg: #FFFFFF; --btn-hover: #F1F5F9;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    body.dark-mode {
      --bg-color: #0F172A; --text-main: #F8FAFC; --text-sub: #94A3B8;
      --border-color: #334155; --btn-bg: #1E293B; --btn-hover: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif; background: var(--bg-color);
      color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 32px; background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
    }
    body.dark-mode header { background: rgba(15,23,42,0.8); }
    .brand h1 { font-size: 18px; font-weight: 700; }
    .brand p { font-size: 12px; color: var(--text-sub); }
    .controls { display: flex; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; font-size: 14px; font-weight: 500;
      border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--btn-bg); color: var(--text-main);
      cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
    }
    .btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
    .btn-primary { background: #2563EB; color: #FFF; border-color: #2563EB; }
    .btn-primary:hover { background: #1D4ED8; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
    .slide-container {
      width: 100%; max-width: 440px; aspect-ratio: 440 / 630;
      background: #FFFFFF; border-radius: 16px;
      box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);
      overflow: hidden; transition: box-shadow 0.3s, transform 0.3s;
    }
    .slide-container:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .slide-container svg { width: 100%; height: 100%; display: block; }
    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #0F172A; color: #FFF;
      padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
      box-shadow: var(--shadow-lg); transform: translateY(100px); opacity: 0;
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1); z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>System Process Flowchart</h1>
      <p>Zigzag flow with diamond connectors</p>
    </div>
    <div class="controls">
      <button class="btn" id="themeToggleBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        Dark Mode
      </button>
      <button class="btn" id="copyBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        Copy SVG
      </button>
      <button class="btn btn-primary" id="downloadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Download SVG
      </button>
    </div>
  </header>

  <main>
    <div class="slide-container" id="slideContainer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 630">
        <rect width="100%" height="100%" fill="#FFFFFF"/>

        <!-- ===== START (black pill) ===== -->
        <rect x="110" y="20" width="220" height="36" rx="18" fill="#1a1a1a"/>
        <text x="220" y="43" text-anchor="middle" fill="#FFF"
              font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Start</text>

        <!-- Connector: Start → Step 1 -->
        <line x1="220" y1="56" x2="232" y2="67" stroke="#333" stroke-width="1.5"/>
        <polygon points="232,62 237,67 232,72 227,67" fill="#333"/>
        <line x1="232" y1="67" x2="245" y2="78" stroke="#333" stroke-width="1.5"/>

        <!-- ===== STEP 1: User Login/Register (RIGHT) ===== -->
        <rect x="120" y="78" width="250" height="38" rx="8" fill="#FFF" stroke="#333" stroke-width="1.3"/>
        <text x="245" y="102" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">User Login/Register</text>

        <!-- Connector: Step 1 → Step 2 -->
        <line x1="245" y1="116" x2="220" y2="128" stroke="#333" stroke-width="1.5"/>
        <polygon points="220,123 225,128 220,133 215,128" fill="#333"/>
        <line x1="220" y1="128" x2="195" y2="140" stroke="#333" stroke-width="1.5"/>

        <!-- ===== STEP 2: Enter Suspicious URL (LEFT) ===== -->
        <rect x="70" y="140" width="250" height="38" rx="8" fill="#FFF" stroke="#333" stroke-width="1.3"/>
        <text x="195" y="164" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">Enter Suspicious URL</text>

        <!-- Connector: Step 2 → Step 3 -->
        <line x1="195" y1="178" x2="220" y2="190" stroke="#333" stroke-width="1.5"/>
        <polygon points="220,185 225,190 220,195 215,190" fill="#333"/>
        <line x1="220" y1="190" x2="245" y2="202" stroke="#333" stroke-width="1.5"/>

        <!-- ===== STEP 3: Phishing URL Analysis (RIGHT) ===== -->
        <rect x="120" y="202" width="250" height="38" rx="8" fill="#FFF" stroke="#333" stroke-width="1.3"/>
        <text x="245" y="226" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">Phishing URL Analysis</text>

        <!-- Connector: Step 3 → Step 4 -->
        <line x1="245" y1="240" x2="220" y2="252" stroke="#333" stroke-width="1.5"/>
        <polygon points="220,247 225,252 220,257 215,252" fill="#333"/>
        <line x1="220" y1="252" x2="195" y2="264" stroke="#333" stroke-width="1.5"/>

        <!-- ===== STEP 4: Cyber Risk Assessment (LEFT) ===== -->
        <rect x="70" y="264" width="250" height="38" rx="8" fill="#FFF" stroke="#333" stroke-width="1.3"/>
        <text x="195" y="288" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">Cyber Risk Assessment</text>

        <!-- Connector: Step 4 → Step 5 -->
        <line x1="195" y1="302" x2="220" y2="314" stroke="#333" stroke-width="1.5"/>
        <polygon points="220,309 225,314 220,319 215,314" fill="#333"/>
        <line x1="220" y1="314" x2="245" y2="326" stroke="#333" stroke-width="1.5"/>

        <!-- ===== STEP 5: AI Explanation & Guidance (RIGHT) ===== -->
        <rect x="120" y="326" width="250" height="38" rx="8" fill="#FFF" stroke="#333" stroke-width="1.3"/>
        <text x="245" y="350" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">AI Explanation &amp; Guidance</text>

        <!-- Connector: Step 5 → Step 6 -->
        <line x1="245" y1="364" x2="220" y2="376" stroke="#333" stroke-width="1.5"/>
        <polygon points="220,371 225,376 220,381 215,376" fill="#333"/>
        <line x1="220" y1="376" x2="195" y2="388" stroke="#333" stroke-width="1.5"/>

        <!-- ===== STEP 6: Personalized Recovery Guide (LEFT) ===== -->
        <rect x="70" y="388" width="250" height="38" rx="8" fill="#FFF" stroke="#333" stroke-width="1.3"/>
        <text x="195" y="412" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">Personalized Recovery Guide</text>

        <!-- Connector: Step 6 → Step 7 -->
        <line x1="195" y1="426" x2="220" y2="438" stroke="#333" stroke-width="1.5"/>
        <polygon points="220,433 225,438 220,443 215,438" fill="#333"/>
        <line x1="220" y1="438" x2="245" y2="450" stroke="#333" stroke-width="1.5"/>

        <!-- ===== STEP 7: Generate Incident Report (RIGHT) ===== -->
        <rect x="120" y="450" width="250" height="38" rx="8" fill="#FFF" stroke="#333" stroke-width="1.3"/>
        <text x="245" y="474" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">Generate Incident Report</text>

        <!-- Connector: Step 7 → Step 8 -->
        <line x1="245" y1="488" x2="220" y2="500" stroke="#333" stroke-width="1.5"/>
        <polygon points="220,495 225,500 220,505 215,500" fill="#333"/>
        <line x1="220" y1="500" x2="195" y2="512" stroke="#333" stroke-width="1.5"/>

        <!-- ===== STEP 8: Save Incident History (LEFT) ===== -->
        <rect x="70" y="512" width="250" height="38" rx="8" fill="#FFF" stroke="#333" stroke-width="1.3"/>
        <text x="195" y="536" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500">Save Incident History</text>

        <!-- Connector: Step 8 → End -->
        <line x1="195" y1="550" x2="208" y2="561" stroke="#333" stroke-width="1.5"/>
        <polygon points="208,556 213,561 208,566 203,561" fill="#333"/>
        <line x1="208" y1="561" x2="220" y2="572" stroke="#333" stroke-width="1.5"/>

        <!-- ===== END (black pill) ===== -->
        <rect x="110" y="572" width="220" height="36" rx="18" fill="#1a1a1a"/>
        <text x="220" y="595" text-anchor="middle" fill="#FFF"
              font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">End</text>

      </svg>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const toast = document.getElementById('toast');
    const slideContainer = document.getElementById('slideContainer');

    themeToggleBtn.addEventListener('click', () => document.body.classList.toggle('dark-mode'));

    copyBtn.addEventListener('click', () => {
      const svgContent = slideContainer.innerHTML.trim();
      navigator.clipboard.writeText(svgContent).then(() => showToast('SVG code copied to clipboard!'))
        .catch(err => console.error('Could not copy: ', err));
    });

    downloadBtn.addEventListener('click', () => {
      const svgContent = slideContainer.innerHTML.trim();
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'system_process_flow.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('SVG download started!');
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
