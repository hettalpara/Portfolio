<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Architecture Diagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #F8FAFC; --text-main: #0F172A; --text-sub: #64748B;
      --border-color: #E2E8F0; --btn-bg: #FFFFFF; --btn-hover: #F1F5F9;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    body.dark-mode {
      --bg-color: #0F172A; --text-main: #F8FAFC; --text-sub: #94A3B8;
      --border-color: #334155; --btn-bg: #1E293B; --btn-hover: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif; background: var(--bg-color);
      color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 32px; background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
    }
    body.dark-mode header { background: rgba(15,23,42,0.8); }
    .brand h1 { font-size: 18px; font-weight: 700; }
    .brand p { font-size: 12px; color: var(--text-sub); }
    .controls { display: flex; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; font-size: 14px; font-weight: 500;
      border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--btn-bg); color: var(--text-main);
      cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
    }
    .btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
    .btn-primary { background: #2563EB; color: #FFF; border-color: #2563EB; }
    .btn-primary:hover { background: #1D4ED8; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
    .slide-container {
      width: 100%; max-width: 520px; aspect-ratio: 500 / 530;
      background: #FFFFFF; border-radius: 16px;
      box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);
      overflow: hidden; transition: box-shadow 0.3s, transform 0.3s;
    }
    .slide-container:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .slide-container svg { width: 100%; height: 100%; display: block; }
    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #0F172A; color: #FFF;
      padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
      box-shadow: var(--shadow-lg); transform: translateY(100px); opacity: 0;
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1); z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>System Architecture Diagram</h1>
      <p>Layered architecture — black &amp; white</p>
    </div>
    <div class="controls">
      <button class="btn" id="themeToggleBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        Dark Mode
      </button>
      <button class="btn" id="copyBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        Copy SVG
      </button>
      <button class="btn btn-primary" id="downloadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Download SVG
      </button>
    </div>
  </header>

  <main>
    <div class="slide-container" id="slideContainer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 530">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 10 4, 0 8" fill="#222"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#FFFFFF"/>

        <!-- ============ TITLE ============ -->
        <text x="250" y="34" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">System Architecture</text>

        <!-- ================================================================ -->
        <!-- LAYER 1: User                                                    -->
        <!-- ================================================================ -->
        <rect x="140" y="58" width="220" height="50" rx="10" fill="#FFF" stroke="#222" stroke-width="1.5"/>
        <text x="250" y="88" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">User</text>

        <!-- Arrow 1 → 2 -->
        <line x1="250" y1="108" x2="250" y2="138" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>

        <!-- ================================================================ -->
        <!-- LAYER 2: Web Application (React + Next.js)                       -->
        <!-- ================================================================ -->
        <rect x="100" y="140" width="300" height="54" rx="10" fill="#FFF" stroke="#222" stroke-width="1.5"/>
        <text x="250" y="164" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Web Application</text>
        <text x="250" y="181" text-anchor="middle" fill="#666"
              font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400">(React + Next.js)</text>

        <!-- Arrow 2 → 3 -->
        <line x1="250" y1="194" x2="250" y2="224" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>

        <!-- ================================================================ -->
        <!-- LAYER 3: FastAPI Backend                                         -->
        <!-- ================================================================ -->
        <rect x="110" y="226" width="280" height="50" rx="10" fill="#FFF" stroke="#222" stroke-width="1.5"/>
        <text x="250" y="256" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">FastAPI Backend</text>

        <!-- Arrow 3 → 4 -->
        <line x1="250" y1="276" x2="250" y2="306" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>

        <!-- ================================================================ -->
        <!-- LAYER 4: AI & Security APIs (BIGGER BOX)                         -->
        <!-- ================================================================ -->
        <rect x="65" y="308" width="370" height="78" rx="10" fill="#FFF" stroke="#222" stroke-width="1.5"/>
        <text x="250" y="340" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">AI &amp; Security APIs</text>
        <text x="250" y="362" text-anchor="middle" fill="#666"
              font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400">Gemini · VirusTotal · Google Safe Browsing</text>

        <!-- Arrow 4 → 5 -->
        <line x1="250" y1="386" x2="250" y2="416" stroke="#222" stroke-width="1.8" marker-end="url(#arrow)"/>

        <!-- ================================================================ -->
        <!-- LAYER 5: PostgreSQL Database                                     -->
        <!-- ================================================================ -->
        <rect x="120" y="418" width="260" height="50" rx="10" fill="#FFF" stroke="#222" stroke-width="1.5"/>
        <text x="250" y="448" text-anchor="middle" fill="#111"
              font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">PostgreSQL Database</text>

        <!-- ============ LAYER LABELS (left side) ============ -->
        <text x="50" y="87" text-anchor="end" fill="#AAA"
              font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em">CLIENT</text>
        <text x="50" y="171" text-anchor="end" fill="#AAA"
              font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em">FRONTEND</text>
        <text x="50" y="255" text-anchor="end" fill="#AAA"
              font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em">BACKEND</text>
        <text x="50" y="351" text-anchor="end" fill="#AAA"
              font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em">SERVICES</text>
        <text x="50" y="447" text-anchor="end" fill="#AAA"
              font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em">DATA</text>

      </svg>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const toast = document.getElementById('toast');
    const slideContainer = document.getElementById('slideContainer');

    themeToggleBtn.addEventListener('click', () => document.body.classList.toggle('dark-mode'));

    copyBtn.addEventListener('click', () => {
      const svgContent = slideContainer.innerHTML.trim();
      navigator.clipboard.writeText(svgContent).then(() => showToast('SVG code copied to clipboard!'))
        .catch(err => console.error('Could not copy: ', err));
    });

    downloadBtn.addEventListener('click', () => {
      const svgContent = slideContainer.innerHTML.trim();
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'system_architecture.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('SVG download started!');
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
